[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbi-loss"
version = "1.0.0"
description = "Interpretable image processing for photovoltaic soiling power-loss estimation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "Pillow>=10,<14", "opencv-python-headless>=4.8,<6"]

[tool.setuptools.packages.find]
where = ["src"]
